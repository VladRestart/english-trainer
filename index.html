<title>English с нуля</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: one narrow column like a phrasebook in your pocket; tabs on top, one task at a time */
:root{
  --bg:#EFF3F1; --surface:#FFFFFF; --ink:#132A2A; --muted:#5A6E6B; --line:#D5DFDC;
  --accent:#0B767C; --accent-ink:#FFFFFF; --accent-soft:#DCEDEC;
  --sun:#E89B1C; --sun-soft:#FBEBCD; --good:#2E8549; --good-soft:#DDF0E2; --bad:#C0442D; --bad-soft:#F8E0DA;
  --board-a:#CFE3C3; --board-b:#B8D3A9; --blue:#2F6FD1; --red:#D1422F; --path:#E3D2A6;
  --display:"Unbounded", "Arial Black", system-ui, sans-serif;
  --body:"Golos Text", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1919; --surface:#142424; --ink:#E5EEEB; --muted:#92A7A3; --line:#25403D;
  --accent:#43B6BB; --accent-ink:#04201F; --accent-soft:#16393A;
  --sun:#F2B44C; --sun-soft:#3A2E16; --good:#5CC27B; --good-soft:#173322; --bad:#EE7B63; --bad-soft:#3D1F19;
  --board-a:#2E4B34; --board-b:#25402B; --blue:#5C93EA; --red:#E8644F; --path:#6A5A36;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1919; --surface:#142424; --ink:#E5EEEB; --muted:#92A7A3; --line:#25403D;
  --accent:#43B6BB; --accent-ink:#04201F; --accent-soft:#16393A;
  --sun:#F2B44C; --sun-soft:#3A2E16; --good:#5CC27B; --good-soft:#173322; --bad:#EE7B63; --bad-soft:#3D1F19;
  --board-a:#2E4B34; --board-b:#25402B; --blue:#5C93EA; --red:#E8644F; --path:#6A5A36;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 48px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.35rem;font-weight:700}
h2{font-size:1.1rem;font-weight:500}
p{margin:0}
.muted{color:var(--muted)}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand small{color:var(--muted);font-size:.85rem}
.streak{display:inline-flex;align-items:center;gap:6px;background:var(--sun-soft);color:var(--ink);border-radius:999px;padding:4px 12px;font-weight:600;font-size:.9rem;font-variant-numeric:tabular-nums}
.streak b{color:var(--sun)}

nav{overflow-x:auto;scrollbar-width:none;margin-inline:-4px}
nav::-webkit-scrollbar{display:none}
.tabs{display:flex;gap:6px;padding:4px;width:max-content}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:500;font-size:.92rem;white-space:nowrap}
.tab[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--bg);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat .n{font-family:var(--display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.bar{height:10px;background:var(--bg);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}

.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.mode{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px}
.mode:hover{border-color:var(--accent)}
.mode strong{font-size:1rem}
.mode span{color:var(--muted);font-size:.88rem}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:600}
.chip .c{color:var(--muted);font-variant-numeric:tabular-nums;margin-left:4px;font-weight:400}

.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.good{background:var(--good);color:#fff}
.btn.bad{background:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.split > *{flex:1 1 140px}

.card-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.pill{font-size:.75rem;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--bg);color:var(--muted)}
.pill.say{background:var(--accent-soft);color:var(--accent)}
.pill.hear{background:var(--sun-soft);color:var(--ink)}
.pill.new{background:var(--good-soft);color:var(--good)}
.prompt{font-size:1.5rem;font-weight:600;line-height:1.3;text-wrap:balance}
.prompt.en{font-family:var(--display);font-weight:500;font-size:1.35rem}
.answer{border-top:1px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:6px}
.answer .en{font-family:var(--display);font-size:1.25rem;font-weight:500;line-height:1.35}
.speak{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:.88rem;display:inline-flex;gap:6px;align-items:center}
.speak svg{width:16px;height:16px}
.progress-line{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}

.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:1rem}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.feedback{font-weight:600}
.feedback.ok{color:var(--good)} .feedback.no{color:var(--bad)}

.build{min-height:56px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.build.ok{border-color:var(--good);background:var(--good-soft)} .build.no{border-color:var(--bad);background:var(--bad-soft)}
.wordchip{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;font-size:1rem;font-weight:500}
.build .wordchip{background:var(--surface)}

.chat{display:flex;flex-direction:column;gap:10px;max-height:56vh;overflow-y:auto;padding:4px}
.msg{max-width:88%;border-radius:16px;padding:10px 14px;display:flex;flex-direction:column;gap:6px;min-width:0;overflow-wrap:anywhere}
.msg.bot{background:var(--bg);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--accent);color:var(--accent-ink);align-self:flex-end;border-bottom-right-radius:4px}
.msg .ru{color:var(--muted);font-size:.9rem}
.msg .tools{display:flex;gap:6px;flex-wrap:wrap}
.msg .tools button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:.8rem}
.fix{align-self:flex-end;max-width:88%;background:var(--sun-soft);border-radius:12px;padding:8px 12px;font-size:.9rem}
.fix b{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.composer{display:flex;gap:8px}
.composer input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit}

.search{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px 14px;font:inherit}
.phr-group{display:flex;flex-direction:column}
.phr{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.phr .t{min-width:0}
.phr .t strong{display:block;font-weight:600}
.phr .t span{color:var(--muted);font-size:.92rem}
.phr .r{display:flex;gap:6px;align-items:center}
.lvl{width:44px;height:6px;background:var(--bg);border-radius:999px;overflow:hidden}
.lvl i{display:block;height:100%;background:var(--accent)}
.iconbtn{border:1px solid var(--line);background:var(--bg);border-radius:999px;width:34px;height:34px;display:grid;place-items:center}
.iconbtn svg{width:16px;height:16px}
.note{font-size:.88rem;color:var(--muted)}
.pron{display:flex;flex-direction:column;gap:8px;background:var(--bg);border-radius:14px;padding:12px 14px}
.mic{border:0;border-radius:999px;padding:10px 16px;font-weight:600;background:var(--ink);color:var(--bg);display:inline-flex;gap:8px;align-items:center}
.mic svg{width:18px;height:18px}
.mic.on{background:var(--bad);color:#fff}
.words{font-family:var(--display);font-size:1.15rem;line-height:1.6;display:flex;flex-wrap:wrap;gap:4px 8px}
.words .w-ok{color:var(--good)}
.words .w-no{color:var(--bad);text-decoration:underline wavy;text-underline-offset:4px}
.heard{font-size:.88rem;color:var(--muted)}
.score{font-weight:600}
.tr{color:var(--muted);font-size:.95rem;font-style:italic}

/* Battle */
.arena{display:flex;flex-direction:column;gap:12px}
.turnbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.side-tag{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.side-tag i{width:12px;height:12px;border-radius:50%;display:inline-block}
.side-tag.blue i{background:var(--blue)} .side-tag.red i{background:var(--red)}
.board{position:relative;width:100%;aspect-ratio:8/6;border-radius:16px;overflow:hidden;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(6,1fr);user-select:none;-webkit-user-select:none;touch-action:manipulation;border:1px solid var(--line)}
.cell{border:0;padding:0;margin:0;background:var(--board-a);position:relative;cursor:default}
.cell.dark{background:var(--board-b)}
.cell.mine{cursor:pointer}
.cell.mine:hover{filter:brightness(1.06)}
.cell.move{cursor:pointer}
.cell.move::after{content:"";position:absolute;inset:36%;border-radius:50%;background:var(--good);opacity:.7}
.cell.target{cursor:pointer;box-shadow:inset 0 0 0 3px var(--bad);background-image:radial-gradient(circle,transparent 55%,color-mix(in srgb,var(--bad) 30%,transparent))}
.cell.sel{box-shadow:inset 0 0 0 3px var(--sun)}
.units{position:absolute;inset:0;pointer-events:none}
.unit{position:absolute;width:12.5%;height:16.667%;display:flex;align-items:center;justify-content:center;transition:left .45s ease,top .45s ease,opacity .6s ease}
.unit .base{position:absolute;bottom:9%;width:68%;height:17%;border-radius:50%;opacity:.6}
.unit.blue .base{background:var(--blue)} .unit.red .base{background:var(--red)}
.unit.active .base{opacity:1;box-shadow:0 0 0 3px var(--sun)}
.unit .body{position:relative;font-size:clamp(20px,6.4vw,46px);line-height:1;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 3px 2px rgba(0,0,0,.35))}
.unit .sprite{display:inline-block}
.unit.red .sprite,.unit.blue.flip .sprite,.ic.flip{transform:scaleX(-1)}
.unit.red.flip .sprite{transform:none}
.unit .hp{position:absolute;top:5%;left:16%;right:16%;height:5px;background:rgba(0,0,0,.35);border-radius:3px;overflow:hidden}
.unit .hp i{display:block;height:100%;background:#4FC26E;transition:width .4s}
.unit .hp i.low{background:#F05A43}
.unit .stars{position:absolute;bottom:2%;font-size:clamp(7px,1.6vw,11px);color:var(--sun);text-shadow:0 1px 1px rgba(0,0,0,.6);letter-spacing:1px}
.unit.lunge .body{animation:lunge .4s ease}
.unit.hit .body{animation:shake .45s ease}
.unit.dead{opacity:0}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7%)}}
@keyframes lunge{0%,100%{transform:translateX(0)}45%{transform:translateX(var(--dx,20%)) scale(1.12)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10%)}40%{transform:translateX(10%)}60%{transform:translateX(-6%)}80%{transform:translateX(6%)}}
.dmg{position:absolute;transform:translate(-50%,-50%);font-family:var(--display);font-weight:700;font-size:clamp(14px,3vw,22px);color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.8);animation:floatup 1s ease forwards;pointer-events:none}
.dmg.miss{color:#FFE08A}
@keyframes floatup{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-6%}}
.bolt{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--sun);box-shadow:0 0 12px 3px var(--sun);transform:translate(-50%,-50%);transition:left .35s linear,top .35s linear;pointer-events:none}
.timer i{background:var(--sun);transition:width .2s linear}
.unitcard{display:flex;gap:14px;align-items:center}
.unitcard .big{font-size:44px;line-height:1}
.statrow{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.9rem;color:var(--muted)}
.statrow b{color:var(--ink);font-variant-numeric:tabular-nums}
.army{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.army div{display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:12px;padding:8px 10px;font-size:.88rem}
.army span.ic{font-size:28px}
.unit.dodge .body{animation:dodge .45s ease}
@keyframes dodge{0%,100%{transform:translate(0,0)}40%{transform:translate(-18%,-22%) rotate(-8deg)}}
.dmg.info{color:#FFE08A;font-size:clamp(11px,2.2vw,16px);white-space:nowrap}
.dmg.big{font-size:clamp(18px,4vw,30px);color:#FFD34D}
.bolt.magic{background:#B98CFF;box-shadow:0 0 14px 4px #B98CFF}
.guard{background:var(--bad-soft);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.rules{display:flex;flex-direction:column;gap:6px;background:var(--bg);border-radius:12px;padding:12px 14px;font-size:.92rem}
@media (prefers-reduced-motion: reduce){.unit .body{animation:none}}

/* Towers */
.td{display:flex;flex-direction:column;gap:12px}
.td canvas{width:100%;aspect-ratio:3/2;border-radius:16px;border:1px solid var(--line);display:block;touch-action:manipulation;cursor:pointer;background:var(--board-a)}
.hud{display:flex;gap:8px 16px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.stat-i{font-weight:600;font-variant-numeric:tabular-nums}
.shop{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.shopitem{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;display:flex;gap:10px;align-items:center}
.shopitem[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.shopitem:disabled{opacity:.5;cursor:default}
.shopitem .ic{font-size:26px}
.shopitem small{display:block;color:var(--muted)}
.tr::before{content:"["} .tr::after{content:"]"}
.empty{padding:24px 8px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
footer{font-size:.82rem;color:var(--muted);text-align:center}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div class="brand"><h1>English с нуля</h1><small>фразы на каждый день</small></div>
    <span class="streak" id="streak" title="Дней подряд"><b>●</b> <span id="streakN">0</span> дн. подряд</span>
  </header>

  <nav aria-label="Разделы"><div class="tabs" id="tabs">
    <button class="tab" data-view="home">Сегодня</button>
    <button class="tab" data-view="battle">Битва</button>
    <button class="tab" data-view="towers">Башни</button>
    <button class="tab" data-view="cards">Карточки</button>
    <button class="tab" data-view="quiz">Что сказать?</button>
    <button class="tab" data-view="listen">На слух</button>
    <button class="tab" data-view="say">Произношение</button>
    <button class="tab" data-view="build">Собери фразу</button>
    <button class="tab" data-view="chat">Диалог</button>
    <button class="tab" data-view="book">Разговорник</button>
  </div></nav>

  <main>
    <section class="view" id="v-home"></section>
    <section class="view" id="v-battle" hidden></section>
    <section class="view" id="v-towers" hidden></section>
    <section class="view" id="v-cards" hidden></section>
    <section class="view" id="v-quiz" hidden></section>
    <section class="view" id="v-listen" hidden></section>
    <section class="view" id="v-say" hidden></section>
    <section class="view" id="v-build" hidden></section>
    <section class="view" id="v-chat" hidden></section>
    <section class="view" id="v-book" hidden></section>
  </main>

  <footer id="sync">Прогресс сохраняется в этом браузере</footer>
</div>

<script>
// ---------- Phrases: type|English|Russian. "say" = говоришь ты, "hear" = слышишь в ответ ----------
const SITUATIONS = [
 {id:"meet", name:"Знакомство", raw:`say|Nice to meet you.|Приятно познакомиться.
say|My name is Vlad.|Меня зовут Влад.
say|What's your name?|Как тебя зовут?
say|Where are you from?|Откуда ты?
say|I'm from Russia.|Я из России.
say|I live in Nha Trang.|Я живу в Нячанге.
hear|What do you do?|Чем ты занимаешься?
say|I make videos for my blog.|Я делаю видео для своего блога.
say|My English is not very good.|Мой английский не очень хороший.
say|Could you speak more slowly, please?|Говорите, пожалуйста, помедленнее.
say|Sorry, I don't understand.|Извините, я не понимаю.
say|See you later!|Увидимся!`},
 {id:"shop", name:"Магазин и цены", raw:`say|How much is this?|Сколько это стоит?
say|How much are these?|Сколько стоят вот эти?
say|It's too expensive.|Это слишком дорого.
say|Can you give me a discount?|Можете сделать скидку?
say|Do you have a smaller size?|У вас есть размер поменьше?
say|Can I try it on?|Можно примерить?
say|I'm just looking, thanks.|Я просто смотрю, спасибо.
say|I'll take it.|Я возьму это.
say|Can I pay by card?|Можно оплатить картой?
hear|Cash or card?|Наличными или картой?
hear|Do you need a bag?|Вам нужен пакет?
say|Can I have a receipt, please?|Можно чек, пожалуйста?`},
 {id:"way", name:"Как пройти", raw:`say|Excuse me, where is the supermarket?|Извините, где находится супермаркет?
say|How do I get to the beach?|Как мне пройти к пляжу?
say|Is it far from here?|Это далеко отсюда?
say|Is there a pharmacy near here?|Здесь рядом есть аптека?
say|Can you show me on the map?|Можете показать на карте?
hear|It's close, just over there.|Это близко, вон там.
hear|Go that way.|Идите туда.
hear|Go straight, then turn left.|Идите прямо, потом поверните налево.
hear|Turn right at the corner.|На углу поверните направо.
hear|It's next to the bank.|Это рядом с банком.
hear|It's about five minutes on foot.|Примерно пять минут пешком.
say|I'm lost.|Я заблудился.`},
 {id:"cafe", name:"Кафе", raw:`say|A table for two, please.|Столик на двоих, пожалуйста.
say|Can I see the menu, please?|Можно меню, пожалуйста?
hear|Are you ready to order?|Вы готовы сделать заказ?
say|What do you recommend?|Что вы посоветуете?
say|I'd like a coffee with milk.|Я бы хотел кофе с молоком.
say|Not spicy, please.|Не острое, пожалуйста.
say|No ice, please.|Без льда, пожалуйста.
hear|For here or to go?|Здесь или с собой?
say|To go, please.|С собой, пожалуйста.
say|The bill, please.|Счёт, пожалуйста.
say|It was delicious, thank you!|Было очень вкусно, спасибо!`},

  cannon: { name: "Пушка",   icon: "💣", cost: 90,  tier: 2, dmg: 24, range: 2.2, rate: 1.6, splash: 0.9, color: "#5E636D", note: "бьёт по группе" },
  mage:   { name: "Маги",    icon: "🔮", cost: 130, tier: 3, dmg: 30, range: 2.9, rate: 1.2, color: "#7656C4", note: "сильно бьют и замедляют" }
};
const TD_MAX_LVL = 4, TD_WAVES = 10, TD_LIVES = 15;
// Difficulty: enemy health, how many enemies, and how much stronger each wave gets.

const SCEN = [

  { id: "shop", t: "Магазин", p: "You are a shop assistant in a clothes shop in Nha Trang. Vlad wants to buy a T-shirt. Talk about sizes and prices." },

  { id: "cafe", t: "Кафе", p: "You are a waiter in a cafe. Take Vlad's order and later bring the bill." },
  { id: "bank", t: "Банк", p: "You are a bank employee. Vlad wants to open an account and get a bank card. Ask about documents." },
  { id: "taxi", t: "Такси", p: "You are a taxi driver in Nha Trang. Vlad gets in your car. Ask where he is going and chat a little." },
  { id: "home", t: "Аренда жилья", p: "You are a landlord. Vlad wants to rent an apartment for some months. Talk about price, rooms and bills." }
